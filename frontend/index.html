<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>闲鱼管理系统 · 发布中心</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{--bg:#f6f7fb;--panel:#fff;--muted:#7b7f88;--accent:#6c63ff;--accent-2:#5b3ce6}
    *{box-sizing:border-box}
    body{font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial; background:var(--bg); margin:0}
    .app{display:flex;min-height:100vh}

    /* left nav */
    .nav{width:86px;background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#fff;padding:18px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
    .nav .logo{width:56px;height:56px;border-radius:10px;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-weight:700}
    .nav button{background:transparent;border:0;color:rgba(255,255,255,0.9);cursor:pointer}

    /* main */
    .main{flex:1;display:flex;padding:20px;gap:20px}
    .col{background:var(--panel);border-radius:12px;padding:16px;box-shadow:0 4px 12px rgba(22,24,27,0.06)}
    .left{width:840px}
    .right{width:360px;display:flex;flex-direction:column;gap:12px}

    h2{margin:0 0 12px 0}
    label{font-size:13px;color:var(--muted)}
    input,textarea,select{width:100%;padding:10px;border:1px solid #e6e9ee;border-radius:8px;margin-top:6px;margin-bottom:10px}
    textarea{min-height:90px}
    .row{display:flex;gap:12px}
    .row > div{flex:1}
    .actions{display:flex;gap:8px}
    .btn{background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}
    .btn.ghost{background:transparent;color:var(--accent);border:1px solid #e6e9ee}

    .imgs-row{display:flex;flex-wrap:wrap;gap:8px}
    .img-thumb{width:88px;height:88px;border-radius:8px;object-fit:cover;border:1px solid #f0f0f0}
    .notice{color:var(--muted);font-size:13px}

    .materials .material{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;border:1px solid #f3f4f6;margin-bottom:8px}
    .material-img{width:56px;height:56px;border-radius:6px;object-fit:cover}
    .record{padding:8px;border-radius:8px;border:1px dashed #efefef;margin-bottom:8px}

    .small{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <div class="app">
    <div class="nav">
      <div class="logo">XY</div>
      <button title="仪表盘">🏠</button>
      <button title="商品发布">➕</button>
      <button title="商品库">📦</button>
      <button title="订单">🧾</button>
    </div>

    <div class="main">
      <div class="left col">
        <h2>商品发布 / 编辑</h2>
        <div>
          <label>商品标题</label>
          <input id="p_title" placeholder="输入商品标题，系统会基于标题建议类目" />

          <label>类别提示（可选）</label>
          <input id="p_category" placeholder="例如：手机、数码配件、图书、服饰" />

          <label>商品描述</label>
          <textarea id="p_description" placeholder="输入商品描述，建议包含规格、发货说明等"></textarea>

          <div class="row">
            <div>
              <label>现价</label>
              <input id="p_price" placeholder="¥ 价格" />
            </div>
            <div>
              <label>原价（可选）</label>
              <input id="p_original_price" placeholder="¥ 原价（可选）" />
            </div>
          </div>

          <label>商品规格（多规格用逗号分隔）</label>
          <input id="p_spec" placeholder="如：普通/高级/豪华" />

          <label>商品图片（1-9 张）</label>
          <input id="p_images" type="file" multiple accept="image/*" />
          <div class="imgs-row" id="preview_images"></div>
          <div class="notice">建议 1 张主图 + 1-8 张详情图；系统会保存到素材库以便复用。</div>

          <div style="margin-top:12px" class="actions">
            <button class="btn" onclick="publishSingle()">发布商品</button>
            <button class="btn ghost" onclick="saveMaterial()">保存为素材</button>
            <button class="btn ghost" onclick="resetForm()">重置表单</button>
            <button class="btn ghost" onclick="recognizeAttributes()">智能识别属性</button>
          </div>

          <div style="margin-top:14px"><span id="recognize_result" class="small"></span></div>

          <hr style="margin:18px 0">
          <h3>商品列表</h3>
          <div id="products"></div>
        </div>
      </div>

      <div class="right">
        <div class="col">
          <h3>账号管理</h3>
          <div id="accounts"></div>
          <div style="margin-top:10px">
            <input id="acc_name" placeholder="账号名" />
            <input id="acc_cookie" placeholder="Cookie（可选）" />
            <div style="margin-top:8px"><button class="btn" onclick="addAccount()">添加账号</button></div>
          </div>
        </div>

        <div class="col materials">
          <h3>素材库</h3>
          <div id="materials"></div>
          <div class="small">点击“导入”把素材内容填入表单，或上传图片管理素材。</div>
        </div>

        <div class="col">
          <h3>发布记录</h3>
          <div id="records"></div>
        </div>

      </div>
    </div>
  </div>

<script>
async function fetchJson(url, opts){
  let r = await fetch(url, opts);
  if(!r.ok){ let t = await r.text(); throw new Error(t||'Request failed'); }
  return r.json();
}

async function load(){
  try{
    let accs = await fetchJson('/accounts');
    document.getElementById('accounts').innerHTML = accs.map(a=>`<div class="item">ID:${a.id} ${a.name} (${a.enabled? 'on':'off'})</div>`).join('');

    let products = await fetchJson('/products');
    document.getElementById('products').innerHTML = products.map(p=>`<div class="item"><b>${p.title}</b><div class="imgs-row">${(p.images||[]).map(i=>`<img class="img-thumb" src="/${i}">`).join('')}</div><div class="small">${p.category||''} · ¥${p.price||''} · ${p.spec||''}</div></div>`).join('');

    let recs = await fetchJson('/publish-records');
    document.getElementById('records').innerHTML = recs.map(r=>`<div class="record">${r.created_at}<br>账号:${r.account_id} 商品:${r.product_id}</div>`).join('');

    let mats = await fetchJson('/materials');
    document.getElementById('materials').innerHTML = mats.map(m=>`<div class="material"><img class="material-img" src="/${(m.images||[])[0]||''}" onerror="this.style.display='none'"><div style="flex:1"><b>${m.title}</b><div class="small">${m.description||''}</div></div><div><button class="btn ghost" onclick="importMaterial(${m.id})">导入</button><button class="btn ghost" onclick="deleteMaterial(${m.id})">删除</button></div></div>`).join('');
  }catch(e){console.error(e)}
}

async function addAccount(){
  let name = document.getElementById('acc_name').value;
  let cookie = document.getElementById('acc_cookie').value;
  await fetchJson('/accounts', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, cookie})});
  load();
}

async function addProduct(){
  let title = document.getElementById('p_title').value;
  let category = document.getElementById('p_category').value;
  let description = document.getElementById('p_description').value;
  let price = parseFloat(document.getElementById('p_price').value)||0;
  let original_price = parseFloat(document.getElementById('p_original_price').value)||0;
  let spec = document.getElementById('p_spec').value || '';
  let res = await fetchJson('/products', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title, category, description, price, original_price, spec})});
  return res.id;
}

async function uploadImagesToProduct(pid, files){
  for(let f of files){
    let fd = new FormData();
    fd.append('file', f, f.name);
    await fetch(`/products/${pid}/upload-image`, {method:'POST', body:fd});
  }
}

async function publishSingle(){
  try{
    let pid = await addProduct();
    let files = document.getElementById('p_images').files;
    if(files && files.length>0){
      if(files.length>9){alert('最多上传9张图片');return}
      await uploadImagesToProduct(pid, files);
    }
    let accs = await fetchJson('/accounts');
    let aids = accs.map(a=>a.id);
    await fetchJson('/publish', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({product_ids:[pid], account_ids:aids})});
    alert('已发布（模拟）');
    resetForm();
    load();
  }catch(e){alert('发布失败: '+e.message)}
}

async function saveMaterial(){
  try{
    let title = document.getElementById('p_title').value;
    let description = document.getElementById('p_description').value;
    let res = await fetchJson('/materials', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title, description})});
    let mid = res.id;
    let files = document.getElementById('p_images').files;
    if(files && files.length>0){
      if(files.length>9){alert('最多上传9张图片');return}
      for(let f of files){
        let fd = new FormData(); fd.append('file', f, f.name);
        await fetch(`/materials/${mid}/upload-image`, {method:'POST', body:fd});
      }
    }
    alert('素材已保存');
    resetForm(); load();
  }catch(e){alert('保存素材失败: '+e.message)}
}

async function deleteMaterial(mid){ if(!confirm('确认删除素材?')) return; await fetchJson(`/materials/${mid}`, {method:'DELETE'}); load(); }
async function importMaterial(mid){ let mats = await fetchJson('/materials'); let m = mats.find(x=>x.id===mid); if(m){ document.getElementById('p_title').value = m.title || ''; document.getElementById('p_description').value = m.description || ''; } }

async function recognizeAttributes(){
  let title = document.getElementById('p_title').value;
  let desc = document.getElementById('p_description').value;
  let fd = new FormData(); fd.append('title', title); fd.append('description', desc);
  let r = await fetch('/recognize-attributes', {method:'POST', body:fd});
  let j = await r.json();
  if(j.category) document.getElementById('p_category').value = j.category;
  if(j.spec) document.getElementById('p_spec').value = j.spec;
  document.getElementById('recognize_result').innerText = '已识别: ' + JSON.stringify(j);
}

function resetForm(){ document.getElementById('p_title').value=''; document.getElementById('p_category').value=''; document.getElementById('p_description').value=''; document.getElementById('p_price').value=''; document.getElementById('p_original_price').value=''; document.getElementById('p_spec').value=''; document.getElementById('p_images').value=''; document.getElementById('preview_images').innerHTML=''; }

document.getElementById('p_images').addEventListener('change', (e)=>{ let out = document.getElementById('preview_images'); out.innerHTML=''; let files = e.target.files; if(files.length>9){ alert('最多上传9张图片'); e.target.value=''; return } for(let f of files){ let img = document.createElement('img'); img.className='img-thumb'; img.src = URL.createObjectURL(f); out.appendChild(img); } });

load().catch(e=>console.error(e));
</script>
</body>
</html>
